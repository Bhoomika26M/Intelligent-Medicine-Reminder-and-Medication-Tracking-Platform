version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pillsync_db
    environment:
      POSTGRES_USER: pillsync_user
      POSTGRES_PASSWORD: pillsync_password
      POSTGRES_DB: pillsync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillsync_user -d pillsync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pillsync_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://pillsync_user:pillsync_password@db:5432/pillsync_db
      - SECRET_KEY=supersecretkey_change_in_production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pillsync_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
